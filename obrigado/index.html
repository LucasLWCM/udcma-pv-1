<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra Quase Completa — Protocolo Resgate Estoico</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;800;900&family=DM+Sans:wght@400;500;700;800&display=swap">

  <style>
    :root {
      --bg-page: #0E0E0E;
      --cta-primary: #EBC068;
      --cta-gold-mid: #C79E3B;
      --cta-text: #070707;
      --text-main: #F5F0E8;
      --text-secondary: #C2BCB0;
      --accent-red: #E8453F;
      --font-heading: 'Barlow', sans-serif;
      --font-body: 'DM Sans', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: #141414;
      padding: 48px 32px;
      border-radius: 16px;
      border: 1px solid rgba(199, 158, 59, 0.2);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    /* Progress Bar */
    .progress-wrapper {
      width: 100%;
      background: #222;
      border-radius: 999px;
      height: 28px;
      margin-bottom: 40px;
      overflow: hidden;
      position: relative;
      border: 1px solid #333;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--cta-gold-mid), var(--cta-primary));
      width: 0%;
      border-radius: 999px;
      transition: width 2s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .progress-text {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 0;
      left: 0;
      line-height: 28px;
      font-size: 14px;
      font-weight: 800;
      color: #FFF;
      font-family: var(--font-heading);
      z-index: 2;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      letter-spacing: 0.5px;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(26px, 5vw, 34px);
      font-weight: 900;
      color: #E8453F;
      text-transform: uppercase;
      margin-bottom: 24px;
      line-height: 1.15;
    }

    p.subtitle {
      font-family: var(--font-heading);
      font-size: clamp(20px, 4vw, 24px);
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 24px;
    }

    p.warning {
      font-size: 17px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 32px;
      padding: 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    p.warning strong {
      color: var(--cta-primary);
    }

    .pointers {
      font-size: 32px;
      margin-bottom: 24px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(10px); }
    }

    @keyframes btnPulse {
      0%, 100% { transform: scale(1); box-shadow: rgba(235, 192, 104, 0.25) 0px 0px 24px 0px; }
      50% { transform: scale(1.045); box-shadow: rgba(235, 192, 104, 0.45) 0px 0px 36px 0px; }
    }

    .btn-cta {
      display: inline-block;
      background: var(--cta-primary);
      color: var(--cta-text);
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 800;
      padding: 20px 40px;
      border-radius: 999px;
      text-decoration: none;
      text-transform: uppercase;
      width: 100%;
      cursor: pointer;
      animation: btnPulse 2s ease-in-out infinite;
      transition: transform 0.15s ease;
      box-shadow: rgba(235, 192, 104, 0.25) 0px 0px 24px 0px;
    }

    .btn-cta:hover {
      animation: none;
      transform: translateY(-2px);
      box-shadow: rgba(235, 192, 104, 0.35) 0px 0px 32px 0px;
    }
  </style>
</head>

<body>
  <div class="container">
    
    <div class="progress-wrapper">
      <div class="progress-text">CARREGANDO... <span id="progress-number">0</span>%</div>
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <h1>SUA COMPRA ESTÁ QUASE COMPLETA</h1>
    
    <p class="subtitle">Seu acesso vai chegar a qualquer momento no seu Whatsapp.</p>
    
    <p class="warning">Mas antes você deve <strong>entrar no grupo de alunos</strong>. Por lá que envio os avisos de aulas, atualizações e tudo relacionado ao curso!</p>

    <div class="pointers">👇👇</div>

    <a href="https://chat.whatsapp.com/GBpVDnMc17bLQiHPu2Fwiw" class="btn-cta" target="_blank" rel="noopener noreferrer">
      ENTRAR NO GRUPO DE ALUNOS
    </a>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('progress-bar').style.width = '95%';
        
        let counter = 0;
        const numberEl = document.getElementById('progress-number');
        const interval = setInterval(() => {
          if(counter >= 95) {
            clearInterval(interval);
          } else {
            counter++;
            numberEl.textContent = counter;
          }
        }, 20);
      }, 300);
    });
  </script>
</body>

</html>
