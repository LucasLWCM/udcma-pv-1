<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste Dobra 10 Garantia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800&family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cta-primary: #EBC068;
    --gold-dark: #855605;
    --gold-dark-text: #634003;
    --font-heading: 'Barlow', sans-serif;
    --font-body: 'Barlow', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0E0E0E;
    color: #FFFFFF;
    font-family: var(--font-body);
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }

  /* ── SEÇÃO GARANTIA P12 ── */
  #guarantee {
    width: 100%;
    max-width: 600px;
    padding: clamp(40px, 6vw, 60px) 16px;
    background: radial-gradient(ellipse 550px 380px at 50% 50%, rgba(235, 192, 104, 0.08) 0%, rgba(180, 120, 30, 0.02) 50%, transparent 75%), #0E0E0E;
    position: relative;
  }

  .guarantee-card {
    background: #FFFFFF;
    border-radius: 28px;
    padding: clamp(36px, 5vw, 48px) clamp(20px, 4vw, 36px);
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
    position: relative;
  }

  /* Badge com '7' e Anel de 7 marcas */
  .guarantee-badge {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .guarantee-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .ring-track {
    stroke: rgba(133, 86, 5, 0.18);
    stroke-width: 1.5;
  }

  .ring-mark {
    fill: #855605;
    transition: fill 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
    transform-origin: center;
  }

  .guarantee-card .huge-number {
    font-family: 'Barlow', sans-serif;
    font-size: clamp(96px, 12vw, 115px);
    font-weight: 900;
    color: #855605;
    line-height: 0.95;
    display: block;
    position: relative;
    z-index: 1;
    letter-spacing: -0.02em;
    user-select: none;
  }

  .guarantee-card h2 {
    font-family: 'Barlow', sans-serif;
    font-size: clamp(24px, 3.5vw, 30px);
    font-weight: 900;
    color: #855605;
    margin-bottom: 14px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .guarantee-card p {
    font-family: 'Barlow', sans-serif;
    font-size: clamp(16px, 2vw, 17px);
    color: #1C1917;
    font-weight: 500;
    line-height: 1.5;
    margin: 0 auto;
    max-width: 420px;
  }

  /* Linha fina separadora */
  .guarantee-divider {
    border: none;
    border-top: 1px solid rgba(0, 0, 0, 0.09);
    margin: 22px 0;
    width: 100%;
  }

  /* Estatísticas aprovadas */
  .guarantee-stats {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    justify-content: center;
  }

  @media (min-width: 520px) {
    .guarantee-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  @media (min-width: 520px) {
    .stat-item {
      align-items: flex-start;
      text-align: left;
    }
  }

  .stat-line {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: center;
  }

  @media (min-width: 520px) {
    .stat-line {
      justify-content: flex-start;
    }
  }

  .stat-num {
    font-family: 'Barlow', sans-serif;
    font-size: clamp(19px, 2.2vw, 22px);
    font-weight: 800;
    color: #855605;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .stat-label {
    font-family: 'Barlow', sans-serif;
    font-size: clamp(14px, 1.6vw, 15px);
    font-weight: 600;
    color: #634003;
    line-height: 1.2;
  }

  /* Barra horizontal fina do 0,70% */
  .refund-bar-track {
    width: 100%;
    max-width: 170px;
    height: 3px;
    background: rgba(133, 86, 5, 0.16);
    border-radius: 999px;
    margin-top: 7px;
    overflow: hidden;
  }

  @media (max-width: 519px) {
    .refund-bar-track {
      margin-left: auto;
      margin-right: auto;
    }
  }

  .refund-bar-fill {
    height: 100%;
    width: 0.70%;
    min-width: 2px;
    background: #855605;
    border-radius: 999px;
  }

  /* Botão CTA Garantia */
  .guarantee-card .btn-cta {
    display: block;
    width: 100%;
    background: linear-gradient(180deg, #F5D27E 0%, #E2B34B 100%);
    color: #0E0E0E;
    font-family: 'Barlow', sans-serif;
    font-size: clamp(16px, 2vw, 18px);
    font-weight: 800;
    padding: 18px 24px;
    border-radius: 999px;
    border: none;
    box-shadow: 0 4px 18px rgba(226, 179, 75, 0.42);
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .guarantee-card .btn-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 22px rgba(226, 179, 75, 0.6);
  }

  .guarantee-card .btn-cta:active {
    transform: scale(0.985) translateY(1px);
    box-shadow: 0 2px 8px rgba(226, 179, 75, 0.35);
  }

  /* Shimmer no botão */
  .guarantee-card .btn-cta::after {
    content: '';
    position: absolute;
    top: -50%;
    bottom: -50%;
    left: 0;
    width: 60px;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.55) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    transform: skewX(-25deg) translateX(-150px);
    pointer-events: none;
  }

  .guarantee-card.btn-shimmer-active .btn-cta::after {
    animation: btnShimmerSweep 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes btnShimmerSweep {
    0% { transform: skewX(-25deg) translateX(-150px); }
    18% { transform: skewX(-25deg) translateX(450px); }
    100% { transform: skewX(-25deg) translateX(450px); }
  }

  .guarantee-card .cta-sub {
    display: inline-block;
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    color: #855605;
    text-decoration: underline;
    font-style: italic;
    letter-spacing: 0.05em;
    margin-top: 18px;
    transition: color 0.2s ease;
  }

  .guarantee-card .cta-sub:hover {
    color: #5d3c03;
  }
</style>
</head>
<body>

<section id="guarantee">
  <div class="guarantee-card btn-shimmer-active">
    <div class="guarantee-badge">
      <svg class="guarantee-ring" viewBox="0 0 180 180" aria-hidden="true" focusable="false">
        <circle class="ring-track" cx="90" cy="90" r="70" fill="none" />
        <circle class="ring-mark mark-1" cx="90.0" cy="20.0" r="4.5" />
        <circle class="ring-mark mark-2" cx="144.73" cy="46.36" r="4.5" />
        <circle class="ring-mark mark-3" cx="158.24" cy="105.57" r="4.5" />
        <circle class="ring-mark mark-4" cx="120.37" cy="153.07" r="4.5" />
        <circle class="ring-mark mark-5" cx="59.63" cy="153.07" r="4.5" />
        <circle class="ring-mark mark-6" cx="21.76" cy="105.57" r="4.5" />
        <circle class="ring-mark mark-7" cx="35.27" cy="46.36" r="4.5" />
      </svg>
      <span class="huge-number">7</span>
    </div>

    <h2>DIAS DE GARANTIA</h2>
    <p>Você tem 7 dias para pedir seu dinheiro de volta.<br>Sem perguntas. Sem complicação.</p>

    <!-- Linha fina separadora antes dos números -->
    <hr class="guarantee-divider" aria-hidden="true">

    <!-- ATUALIZAR: dados conferidos em 27/10/2026. Alunos somam Hotmart e outras plataformas; o reembolso é só da Hotmart. -->
    <div class="guarantee-stats">
      <div class="stat-item stat-students">
        <div class="stat-line">
          <span class="stat-num">Mais de 3 mil</span>
          <span class="stat-label">alunos</span>
        </div>
      </div>
      <div class="stat-item stat-refund">
        <div class="stat-line">
          <span class="stat-num">0,70%</span>
          <span class="stat-label">de reembolso na Hotmart</span>
        </div>
        <div class="refund-bar-track" aria-hidden="true">
          <div class="refund-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- Linha fina separadora depois dos números -->
    <hr class="guarantee-divider" aria-hidden="true">

    <a href="https://pay.hotmart.com/X108154869T?off=953h3rmf" class="btn-cta">
      Quero aproveitar a garantia!
    </a>
    <a href="https://pay.hotmart.com/X108154869T?off=953h3rmf" class="cta-sub">
      Acesso IMEDIATO e VITALÍCIO
    </a>
  </div>
</section>

</body>
</html>
