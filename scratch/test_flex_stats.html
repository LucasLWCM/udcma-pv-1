<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flex Stats Test</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0E0E0E;
  font-family: 'Barlow', sans-serif;
  padding: 30px 16px;
  display: flex;
  justify-content: center;
}

.guarantee-card {
  background: #FFFFFF;
  border-radius: 28px;
  padding: 44px 28px;
  max-width: 500px;
  width: 100%;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
  text-align: center;
}

.guarantee-divider {
  border: none;
  border-top: 1px solid rgba(0, 0, 0, 0.08);
  margin: 20px 0;
  width: 100%;
}

/* Stats Container */
.guarantee-stats {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  justify-content: center;
}

@media (min-width: 540px) {
  .guarantee-stats {
    flex-direction: row;
    justify-content: space-between;
    gap: 16px;
  }
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

@media (min-width: 540px) {
  .stat-item {
    align-items: flex-start;
  }
}

.stat-line {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  white-space: nowrap;
}

.stat-num {
  font-family: 'Barlow', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: #855605;
  line-height: 1.2;
}

.stat-label {
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #634003;
  line-height: 1.2;
}

.refund-bar-track {
  width: 100%;
  height: 3px;
  background: rgba(133, 86, 5, 0.16);
  border-radius: 999px;
  margin-top: 6px;
  overflow: hidden;
}

.refund-bar-fill {
  height: 100%;
  width: 0.70%;
  min-width: 2px;
  background: #855605;
  border-radius: 999px;
}
</style>
</head>
<body>
<div class="guarantee-card">
  <hr class="guarantee-divider">
  <!-- ATUALIZAR: dados conferidos em 27/10/2026. Alunos somam Hotmart e outras plataformas; o reembolso é só da Hotmart. -->
  <div class="guarantee-stats">
    <div class="stat-item stat-students">
      <div class="stat-line">
        <span class="stat-num">Mais de 3 mil</span>
        <span class="stat-label">alunos</span>
      </div>
    </div>
    <div class="stat-item stat-refund">
      <div class="stat-line">
        <span class="stat-num">0,70%</span>
        <span class="stat-label">de reembolso na Hotmart</span>
      </div>
      <div class="refund-bar-track" aria-hidden="true">
        <div class="refund-bar-fill"></div>
      </div>
    </div>
  </div>
  <hr class="guarantee-divider">
</div>
</body>
</html>
